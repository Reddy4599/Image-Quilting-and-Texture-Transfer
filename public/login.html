<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - PatchWeaveX</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-tr from-indigo-100 via-purple-200 to-pink-100">

  <div class="bg-white shadow-2xl rounded-xl p-8 w-full max-w-md">
    <h2 class="text-3xl font-bold text-indigo-700 text-center mb-6">Login to PatchWeaveX</h2>
    
    <form id="loginForm" class="space-y-5">
      <input type="text" id="username" placeholder="Username" required
        class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      <input type="password" id="password" placeholder="Password" required
        class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      <button type="submit"
        class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 transition font-semibold">
        Login
      </button>
    </form>

    <p class="text-center text-sm text-gray-700 mt-4">
      Don’t have an account?
      <a href="register.html" class="text-indigo-600 hover:underline font-medium">Register</a>
    </p>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
