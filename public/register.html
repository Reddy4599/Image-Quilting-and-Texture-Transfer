<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register – PatchWeaveX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0D0D0D] text-white min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-gray-900/90 border border-gray-800 p-8 rounded-xl shadow-lg">
    <h2 class="text-2xl font-bold text-center mb-6 text-green-400">Register to PatchWeaveX</h2>

    <form id="registerForm" class="space-y-4">
      <input
        type="text"
        id="username"
        placeholder="Username"
        required
        class="w-full px-4 py-2 rounded bg-gray-800 border border-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-green-500"
      />
      <input
        type="password"
        id="password"
        placeholder="Password"
        required
        class="w-full px-4 py-2 rounded bg-gray-800 border border-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-green-500"
      />
      <button
        type="submit"
        class="w-full bg-green-500 hover:bg-green-600 text-black font-semibold py-2 rounded transition"
      >
        Register
      </button>
    </form>

    <p class="mt-6 text-center text-gray-400 text-sm">
      Already have an account?
      <a href="login.html" class="text-green-400 hover:underline">Login</a>
    </p>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
