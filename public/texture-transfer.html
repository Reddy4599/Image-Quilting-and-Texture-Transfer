<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Texture Transfer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-950 via-gray-900 to-black text-white min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-gradient-to-r from-gray-900 to-gray-800 text-white px-8 py-5 flex justify-between items-center shadow-xl border-b border-gray-700">
    <h1 class="text-4xl font-extrabold tracking-tight">🎨 Texture Transfer</h1>
    <button id="backBtn" class="bg-white text-gray-900 font-semibold px-5 py-2 rounded-lg hover:bg-gray-200 transition-all shadow-md">
        Back to Dashboard
    </button>
  </header>

  <!-- Main -->
  <main class="max-w-7xl mx-auto p-8 space-y-12">

    <!-- Upload Section -->
    <div class="flex flex-col md:flex-row gap-8">
      <!-- Texture -->
      <div class="flex-1 bg-gray-800/80 border border-gray-700 rounded-2xl shadow-2xl p-6">
        <h3 class="text-xl font-bold text-indigo-300 mb-3">Upload Texture Image</h3>
        <input type="file" id="textureImage" accept="image/*" class="mb-4 w-full text-white bg-gray-700 border border-gray-600 rounded px-3 py-2" />
        <div id="texturePreview" class="border-2 border-dashed border-gray-600 rounded-lg bg-gray-900 h-52 flex items-center justify-center overflow-hidden text-sm text-gray-500">Preview</div>
      </div>

      <!-- Target -->
      <div class="flex-1 bg-gray-800/80 border border-gray-700 rounded-2xl shadow-2xl p-6">
        <h3 class="text-xl font-bold text-purple-300 mb-3">Upload Target Image</h3>
        <input type="file" id="targetImage" accept="image/*" class="mb-4 w-full text-white bg-gray-700 border border-gray-600 rounded px-3 py-2" />
        <div id="targetPreview" class="border-2 border-dashed border-gray-600 rounded-lg bg-gray-900 h-52 flex items-center justify-center overflow-hidden text-sm text-gray-500">Preview</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="bg-gray-800/90 border border-gray-700 shadow-xl rounded-2xl p-8 space-y-8">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div>
          <label for="patchSize" class="block font-semibold text-gray-300 mb-1">🧩 Patch Size</label>
          <input type="range" id="patchSize" min="10" max="100" value="30" class="w-full">
          <p class="text-xs text-gray-400 mt-1">Value: <span id="patchSizeValue">30</span></p>
        </div>

        <div>
          <label for="overlap" class="block font-semibold text-gray-300 mb-1">📐 Overlap</label>
          <input type="range" id="overlap" min="5" max="50" value="10" class="w-full">
          <p class="text-xs text-gray-400 mt-1">Value: <span id="overlapValue">10</span></p>
        </div>

        <div>
          <label for="iterations" class="block font-semibold text-gray-300 mb-1">🔁 Iterations</label>
          <input type="range" id="iterations" min="1" max="5" value="3" class="w-full">
          <p class="text-xs text-gray-400 mt-1">Value: <span id="iterationsValue">3</span></p>
        </div>
      </div>

      <div class="text-center">
        <button id="transferBtn" class="bg-indigo-600 text-white px-8 py-3 rounded-full hover:bg-indigo-700 disabled:opacity-50 transition-all shadow-lg text-lg font-semibold">
            Transfer Texture
        </button>
      </div>
    </div>

    <!-- Result Section -->
    <div class="bg-gray-800/90 border border-gray-700 rounded-2xl shadow-xl p-8">
      <h3 class="text-2xl font-bold text-green-400 mb-6">Result</h3>
      <div id="resultContainer" class="hidden border-2 border-dashed border-gray-600 rounded-lg p-6 text-center bg-gray-900">
        <img id="resultImage" alt="Result Image" class="max-w-full max-h-[400px] mx-auto hidden rounded-lg" />
      </div>
      <div class="text-center mt-6">
        <button id="downloadBtn" class="bg-green-600 text-white px-8 py-3 rounded-full hover:bg-green-700 disabled:opacity-50 transition-all shadow-md text-lg font-semibold" disabled>
            Download Result
        </button>
      </div>
    </div>

    <!-- Error Display -->
    <div id="errorDisplay" class="hidden text-red-300 bg-red-900 border border-red-600 rounded p-4 text-center font-medium"></div>
  </main>

  <script src="js/texture-transfer.js"></script>
</body>
</html>
